name: Build Android APK

# A tag v* (its version becomes the app's version) builds the debug APK and
# publishes a release with it; "Run workflow" builds one to download from
# the run's artifacts. Same recipe as piecework, lyric-sync and insight,
# except android/ is committed (Satr has its own native code), so it's
# synced rather than generated.
#
# Needs one secret: ANDROID_KEYSTORE_BASE64, the base64 of a PKCS12 keystore
# with alias "satr" and password "android". The fixed key lets each APK
# install over the previous one.

on:
  push:
    tags:
      - 'v*'
    # TEMPORARY: verify the CharacterCodingException fix on this branch; reverted before merge.
    branches:
      - 'arena/01a0eb11-satr'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit count is the version code

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Set Android version
        # The version comes from the git tag: v0.3.0 builds 0.3.0. A manual
        # run is the latest tag plus the run number (0.3.0-12). package.json's
        # version isn't used.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
            VERSION_NAME="${LATEST_TAG#v}-${GITHUB_RUN_NUMBER}"
          fi

          VERSION_CODE=$(git rev-list --count HEAD)

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Check signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          )

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew

          for i in $(seq 1 3); do
            echo "Gradle build attempt $i"

            if ./gradlew assembleDebug --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"; then
              echo "Build succeeded"
              exit 0
            fi

            echo "Build failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "All build attempts failed."
          exit 1

      - name: Check the APK's signature
        run: |
          # keytool comes with the JDK set up above, so this doesn't depend on
          # which build-tools the runner has. It reads the v1 (jar) signature,
          # which the build adds because minSdk is below 24.
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          CERT="$(keytool -printcert -jarfile "$APK" 2>&1 || true)"
          echo "$CERT"
          if ! grep -q "Owner: .*CN=Satr" <<< "$CERT"; then
            echo "::error::The APK isn't signed with the Satr key from ANDROID_KEYSTORE_BASE64 (alias satr, CN=Satr), so it won't install over earlier builds."
            exit 1
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "satr-debug-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: satr-debug-apk
          path: satr-debug-*.apk
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: satr-debug-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
