<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#101418" />
    <title>Satr</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Cold start: a cover before the app's code loads (src/snapshot.ts
      // lifts it). Restore-last paints the last screen. An empty-tab launch
      // (or no copy) paints the logo instead, so the last note never flashes.
      (function () {
        window.__satrCoverAt = Date.now();
        // The app lifts this cover itself (src/snapshot.ts dropSnapshot) and
        // sets __satrBooted as it goes. The cover is only time-limited as a
        // last resort: taking it away at a fixed 6 s uncovered a blank page
        // for as long as a big note still took to open.
        //
        // But nothing may cancel this watchdog except the cover actually
        // leaving the screen. __satrBooted shortens the leash; it must never
        // cut it. It used to: the app set the flag and then asked for the
        // cover to be lifted on a frame callback, so a frame callback that
        // never came -- the view is not painted while the system splash is
        // still up -- left a full-screen picture of the last screen on top of
        // a perfectly healthy app, for good. It passes touches straight
        // through, so every button still worked and nothing on screen ever
        // changed again. It lives in localStorage, so it came back after a
        // force stop and after the cache was cleared.
        function release(cover, css) {
          var waited = 0;
          var timer = null;
          function lift() {
            if (timer) clearInterval(timer);
            window.removeEventListener('pointerdown', lift, true);
            window.removeEventListener('keydown', lift, true);
            cover.remove();
            if (css) css.remove();
          }
          timer = setInterval(function () {
            if (!cover.isConnected) { lift(); return; }
            waited += 250;
            // Once the app says it is up, the cover has a moment to go the
            // graceful way, and then it goes anyway.
            if (waited >= (window.__satrBooted ? 1500 : 30000)) lift();
          }, 250);
          // And a touch is the reader saying they want the app, not a picture
          // of it. Uncovering a half-painted app is a bad second; a picture
          // that never goes is the end of the app.
          window.addEventListener('pointerdown', lift, true);
          window.addEventListener('keydown', lift, true);
        }
        function splash(bg) {
          var cover = document.createElement('div');
          cover.id = 'boot-snapshot';
          cover.className = 'is-splash';
          cover.setAttribute('aria-hidden', 'true');
          cover.setAttribute('inert', '');
          cover.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:' + bg + ';pointer-events:none';
          var img = document.createElement('img');
          img.src = '/icon-192.png';
          img.width = 96;
          img.height = 96;
          img.alt = '';
          cover.appendChild(img);
          document.body.appendChild(cover);
          release(cover, null);
        }
        function emptyLaunch() {
          try {
            var settings = JSON.parse(localStorage.getItem('satr:settings') || '{}');
            var launch = settings.launchTabs || 'last';
            if (launch === 'empty') return true;
            if (launch !== 'away') return false;
            var since = Number(localStorage.getItem('satr:awayAt') || 0);
            var minutes = Number(settings.newTabAfterMinutes);
            if (!(minutes > 0)) minutes = 30;
            return since > 0 && Date.now() - since >= minutes * 60 * 1000;
          } catch (e) { return false; }
        }
        try {
          var s = JSON.parse(localStorage.getItem('satr:snapshot') || 'null');
          if (s && s.v === 1) {
            if (s.root) document.documentElement.className = s.root;
            if (s.style) document.documentElement.setAttribute('style', s.style);
          }
          var dark = document.documentElement.className.indexOf('theme-dark') >= 0;
          var bg = dark ? '#101418' : '#ffffff';
          if (emptyLaunch() || !s || s.v !== 1 || s.w !== window.innerWidth || Math.abs(s.h - window.innerHeight) > 160) {
            splash(bg);
            return;
          }
          if (s.body) document.body.className = s.body;
          var css = null;
          if (s.css) {
            css = document.createElement('style');
            css.id = 'boot-snapshot-css';
            css.textContent = s.css;
            document.head.appendChild(css);
          }
          var cover = document.createElement('div');
          cover.id = 'boot-snapshot';
          cover.setAttribute('aria-hidden', 'true');
          cover.setAttribute('inert', '');
          cover.innerHTML = s.html;
          document.body.appendChild(cover);
          var all = cover.querySelectorAll('*');
          for (var i = 0; i < s.scroll.length; i++) {
            var el = all[s.scroll[i][0]];
            if (el) el.scrollTop = s.scroll[i][1];
          }
          release(cover, css);
        } catch (e) {
          localStorage.removeItem('satr:snapshot');
          splash('#ffffff');
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
